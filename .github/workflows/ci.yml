name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test ObrPortal
    runs-on: ubuntu-latest

    env:
      SEED_ADMIN_EMAIL: admin@obrportal.local
      SEED_ADMIN_PASSWORD: Admin123Local2026!
      SEED_DEMO_EMAIL: learner@obrportal.local
      SEED_DEMO_PASSWORD: Learner123Local2026!
      SEED_DEMO_ROLE: learner_fl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        run: |
          python scripts/secret_scan.py

      - name: Run text encoding guard
        run: |
          python scripts/check_text_encoding.py

          python scripts/check_source_bom.py
      - name: Run frontend API error guard
        run: |
          python scripts/check_frontend_api_errors.py
          python scripts/check_frontend_mojibake.py
          python scripts/check_frontend_api_base_config.py
          python scripts/check_frontend_no_demo_credentials.py

      - name: Run frontend forbidden pattern guard
        run: |
          python scripts/frontend_guard.py

      - name: Run frontend static serving guard
        run: |
          python scripts/check_frontend_static_serving.py

      - name: Run production frontend static runbook guard
        run: |
          python scripts/check_production_frontend_static_runbook.py

      - name: Run production operations runbook guard
        run: |
          python scripts/check_production_operations_runbook.py

      - name: Run production restore drill runbook guard
        run: |
          python scripts/check_production_restore_drill_runbook.py

      - name: Run production monitoring runbook guard
        run: |
          python scripts/check_production_monitoring_runbook.py

      - name: Run production release runbook guard
        run: |
          python scripts/check_production_release_runbook.py

      - name: Run production incident runbook guard
        run: |
          python scripts/check_production_incident_runbook.py

      - name: Run Stage 12 product roadmap guard
        run: |
          python scripts/check_stage12_product_roadmap.py

      - name: Run Stage 12.1 learner account workflow guard
        run: |
          python scripts/check_stage12_1_learner_account_workflow.py

      - name: Run Stage 12.1 account contract guard
        run: |
          python scripts/check_stage12_1_account_contract.py

      - name: Run CI/local gate consistency guard
        run: |
          python scripts/check_ci_local_gate.py

      - name: Run release readiness guard
        run: |
          python scripts/check_release_readiness.py

      - name: Run release versioning guard
        run: |
          python scripts/check_release_versioning.py

      - name: Run release candidate guard
        run: |
          python scripts/check_release_candidate.py

      - name: Run release tag guard
        run: |
          python scripts/check_release_tag.py

      - name: Run production deployment plan guard
        run: |
          python scripts/check_production_deployment_plan.py

      - name: Run production environment template guard
        run: |
          python scripts/check_production_environment_template.py

      - name: Run production server checklist guard
        run: |
          python scripts/check_production_server_checklist.py

      - name: Run production reverse proxy checklist guard
        run: |
          python scripts/check_production_reverse_proxy_checklist.py

      - name: Run production backup monitoring checklist guard
        run: |
          python scripts/check_production_backup_monitoring_checklist.py

      - name: Run production deployment runbook guard
        run: |
          python scripts/check_production_deployment_runbook.py

      - name: Run production rollout inventory guard
        run: |
          python scripts/check_production_rollout_inventory.py

      - name: Run production server facts guard
        run: |
          python scripts/check_production_server_facts.py

      - name: Run production server preflight execution guard
        run: |
          python scripts/check_production_server_preflight_execution.py

      - name: Run production fact collection result guard
        run: |
          python scripts/check_production_fact_collection_result.py

      - name: Run production server remediation plan guard
        run: |
          python scripts/check_production_server_remediation_plan.py

      - name: Run production domain reverse proxy decision guard
        run: |
          python scripts/check_production_domain_reverse_proxy_decision.py

      - name: Run production domain DNS verification guard
        run: |
          python scripts/check_production_domain_dns_verification.py

      - name: Run production operations Stage 9 guards
        run: |
          python scripts/check_production_operations_baseline.py
          python scripts/check_production_monitoring_smoke.py
          python scripts/check_production_backup_verification.py
          python scripts/check_production_operational_runbook.py
          python scripts/check_production_maintenance_update_checklist.py
          python scripts/check_production_handover_package.py
          python scripts/check_production_stage9_final_gate.py

      - name: Run post Stage 9 roadmap guards
        run: |
          python scripts/check_project_roadmap_after_stage9.py
          python scripts/check_readme_stage10_state.py
          python scripts/check_production_initialization_runbook.py

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Create env file
        run: |
          cp .env.example .env

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Show containers
        run: |
          docker compose ps

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          docker compose logs backend
          exit 1

      - name: Run migrations
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend alembic current
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.db.session import AsyncSessionLocal

          async def main():
              async with AsyncSessionLocal() as session:
                  result = await session.execute(text("select to_regclass('public.users')"))
                  users_table = result.scalar_one()
                  print(f"ci_database_users_table={users_table}")
                  if users_table != "users":
                      raise SystemExit("CI database schema check failed: users table is missing")

          asyncio.run(main())
          PY

      - name: Seed roles and permissions
        run: |
          docker compose exec -T backend python -m app.db.seed

      - name: Seed admin user
        run: |
          docker compose exec -T \
            -e SEED_ADMIN_EMAIL="${SEED_ADMIN_EMAIL}" \
            -e SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}" \
            backend python -m app.db.seed_admin

      - name: Seed learner user
        run: |
          docker compose exec -T \
            -e SEED_DEMO_EMAIL="${SEED_DEMO_EMAIL}" \
            -e SEED_DEMO_PASSWORD="${SEED_DEMO_PASSWORD}" \
            -e SEED_DEMO_ROLE="${SEED_DEMO_ROLE}" \
            backend python -m app.db.seed_demo_user

      - name: Seed demo organization
        run: |
          docker compose exec -T backend python -m app.db.seed_demo_organization

      - name: Run backend pytest
        run: |
          docker compose exec -T backend pytest app/tests -q

      - name: Run auth RBAC and organization cabinet smoke checks
        run: |
          python scripts/smoke_auth_rbac.py
          python scripts/smoke_org_cabinet_utils.py
          python scripts/smoke_org_cabinet_page.py
          python scripts/smoke_org_cabinet_route.py
          python scripts/smoke_documents_page.py
          python scripts/smoke_document_generation_flow.py
          python scripts/smoke_account_page.py
          python scripts/smoke_stage12_1_account_workflow.py
          python scripts/smoke_public_pages.py
          python scripts/smoke_auth_pages.py
          python scripts/smoke_admin_renderer.py
          python scripts/smoke_admin_hooks.py
          python scripts/smoke_frontend_core.py
          python scripts/smoke_shared_components.py
          python scripts/smoke_admin_components.py
          python scripts/smoke_frontend_utils_routes.py
          python scripts/smoke_frontend_hooks_layout.py
          python scripts/smoke_frontend_api_client.py
          python scripts/smoke_frontend_admin_pages.py
          python scripts/smoke_frontend_admin_detail_components.py
          python scripts/smoke_frontend_document_account_flows.py
          python scripts/smoke_frontend_ui_primitives.py
          python scripts/smoke_frontend_static_public_files.py
          python scripts/check_frontend_smoke_coverage.py
          python scripts/check_backend_smoke_coverage.py
          python scripts/check_no_todo_markers.py

      - name: Build frontend
        run: |
          docker compose exec -T frontend npm run build

      - name: Run frontend bundle text encoding guard
        run: |
          python scripts/check_frontend_bundle_encoding.py

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs backend
          docker compose logs frontend

      - name: Stop services
        if: always()
        run: |
          docker compose down -v
