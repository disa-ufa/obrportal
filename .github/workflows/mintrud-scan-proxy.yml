name: Mintrud scan upload proxy boundary

on:
  pull_request:
    paths:
      - backend/app/api/signed_scan_upload_limit.py
      - backend/app/api/v1/mintrud_protocol_drafts.py
      - backend/app/services/mintrud_protocol_scans.py
      - backend/app/tests/test_mintrud_signed_scan_body_limit.py
      - backend/app/tests/m411a_proxy_app.py
      - frontend/nginx.conf
      - scripts/ci_mintrud_scan_proxy.py
      - scripts/test_mintrud_scan_proxy_config.py
      - scripts/check_frontend_static_serving.py
      - .github/workflows/mintrud-scan-proxy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated harness dependencies
        run: |
          python -m pip install fastapi==0.115.6 uvicorn==0.34.0 python-multipart==0.0.20 pytest==8.3.4 pytest-asyncio==0.25.0
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx
      - name: Verify request boundary and configuration
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider backend/app/tests/test_mintrud_signed_scan_body_limit.py
          python scripts/test_mintrud_scan_proxy_config.py
      - name: Exercise real nginx on isolated loopback ports
        run: python scripts/ci_mintrud_scan_proxy.py --evidence runner-evidence/m411a-proxy
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintrud-scan-proxy-evidence
          path: runner-evidence/m411a-proxy
